name: is_journal_client
description: >-
  Reads and writes an is_journal service over its Unix sockets: subscribe,
  tip and get on the read socket, one entry per request on the write socket.
version: 0.1.3
repository: https://github.com/intersyntactic/journal_client

environment:
  sdk: ^3.13.0

dependencies:
  is_journal: '>=0.7.0 <0.11.0'

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
